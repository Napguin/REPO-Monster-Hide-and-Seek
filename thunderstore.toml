# Thunderstore CLI (tcli) config – used by .github/workflows/publish.yml
# The version is taken from thunderstore/manifest.json by the workflow.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Napguin"
name = "HideAndSeekMonster"
versionNumber = "0.0.0"
description = "Hide & Seek for R.E.P.O.: one player becomes a real game monster and hunts the hiders."
websiteUrl = "https://github.com/Napguin/repo-monster-hide-and-seek"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./build"

[[build.copy]]
source = "./dist/stage"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "repo", ]
[publish.categories]
repo = [ ]
